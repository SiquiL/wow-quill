<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">Quill - Write it down. Bring it along.</title>
  <desc id="description">A notebook for World of Warcraft. Markdown notes, connected notebooks and small in-game windows, illustrated by a copper feather and a violet journal.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#211d32"/>
      <stop offset="1" stop-color="#30243c"/>
    </linearGradient>
    <pattern id="ruling" width="40" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 31.5h40" stroke="#c4afe3" stroke-opacity=".07"/>
    </pattern>
  </defs>
